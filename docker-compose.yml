services:
  diagnostics-dev:
    build:
      context: .
      dockerfile: tools/docker/Dockerfile
    image: generic-diagnostics-cpp-dev:local
    working_dir: /workspace
    environment:
      DIAG_DOCKER_UID: "${DIAG_DOCKER_UID:-1000}"
      DIAG_DOCKER_GID: "${DIAG_DOCKER_GID:-1000}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - .:/workspace
    command: >
      sh -lc "./build.py all --preset container-debug"
