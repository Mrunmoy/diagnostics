services:
  diagnostics-dev:
    build:
      context: .
      dockerfile: tools/docker/Dockerfile
    image: generic-diagnostics-dev:local
    working_dir: /workspace
    user: "${DIAG_DOCKER_UID:-1000}:${DIAG_DOCKER_GID:-1000}"
    volumes:
      - .:/workspace
    command: >
      sh -lc "./build.py all --preset container-debug"
